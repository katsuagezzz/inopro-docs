<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="イノベーションプロジェクト 授業資料">
<title>イノベーションプロジェクト 授業資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --rule:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
    --s1:#2a78d6;
    --sans:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --rule:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
      --s1:#3987e5;
    }
  }
  :root[data-theme="dark"]{
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --rule:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --s1:#3987e5;
  }
  html{color-scheme:light dark;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--plane); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding-block:44px 88px; padding-left:24px; padding-right:24px;}
  @media (max-width:640px){ .wrap{padding-left:16px; padding-right:16px; padding-block:30px 64px;} }

  .eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--muted);}
  h1{font-size:clamp(24px,4.2vw,34px); font-weight:700; letter-spacing:-.01em; margin:6px 0 18px; line-height:1.25;}
  .facts{display:flex; flex-wrap:wrap; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin-bottom:40px;}
  .facts div{flex:1 1 140px; padding:11px 14px 11px 0;}
  .facts dt{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.06em;}
  .facts dd{margin:2px 0 0; font-size:13.5px; font-weight:500;}

  h2{font-size:13px; font-weight:700; letter-spacing:.02em; margin:0 0 12px;}

  .list{display:flex; flex-direction:column; border-top:1px solid var(--axis);}
  .row{
    display:grid; grid-template-columns:46px minmax(0,1fr) auto; align-items:baseline; gap:0 14px;
    padding:16px 4px; border-bottom:1px solid var(--rule); text-decoration:none; color:var(--ink);
  }
  .row:hover{background:var(--surface);}
  .row .n{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted);}
  .row .t{font-size:16px; font-weight:700; line-height:1.4;}
  .row .k{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); margin-top:3px; display:block;}
  .row .go{font-family:var(--mono); font-size:11.5px; color:var(--s1); white-space:nowrap;}
  .row.pending{color:var(--muted); pointer-events:none;}
  .row.pending .t{font-weight:500;}
  .row.pending .go{color:var(--muted);}
  @media (max-width:560px){
    .row{grid-template-columns:34px minmax(0,1fr); gap:0 10px;}
    .row .go{grid-column:2; margin-top:6px;}
  }

  a{color:var(--s1);}
  a:focus-visible{outline:2px solid var(--s1); outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">情報経営イノベーション専門職大学</div>
  <h1>イノベーションプロジェクト　授業資料</h1>
  <dl class="facts">

    <div><dt>毎回の型</dt><dd>ニュース → 道具 → 自分の数字</dd></div>
  </dl>

  <h2>資料</h2>
  <div class="list">

    <a class="row" href="b01-kinri.html">
      <span class="n">01</span>
      <span>
        <span class="t">金利と割引現在価値</span>
        <span class="k">利回り・割引現在価値・生涯賃金</span>
      </span>
      <span class="go">開く →</span>
    </a>

    <a class="row" href="b02-torihiki.html">
      <span class="n">02</span>
      <span>
        <span class="t">取引とP/L・B/S</span>
        <span class="k">キャッシュの入口と出口・5つの利益・4象限</span>
      </span>
      <span class="go">開く →</span>
    </a>

    <a class="row" href="b03-hikaku.html">
      <span class="n">03</span>
      <span>
        <span class="t">同業比較と異業種比較</span>
        <span class="k">百分率P/L・在庫回転日数・CFの符号・ROE分解</span>
      </span>
      <span class="go">開く →</span>
    </a>

    <span class="row pending">
      <span class="n">04</span>
      <span>
        <span class="t">準備中</span>
        <span class="k">—</span>
      </span>
      <span class="go">準備中</span>
    </span>

  </div>

</div>
</body>
</html>
